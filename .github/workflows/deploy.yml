name: Deploy to diffusionlab.de

# Uploads the static site to the Hetzner web hosting behind diffusionlab.de
# whenever master changes. Configure in Settings > Environments > production:
#   secrets:   DEPLOY_HOST (e.g. www66.your-server.de), DEPLOY_USER, DEPLOY_PASSWORD
#              DEPLOY_PATH (web root, e.g. public_html; may also be a variable)
#              RUNPOD_API_KEY, RUNPOD_TOKEN_SECRET (optional: with the RUNPOD_* variables
#                below they become api/.secrets/runpod.json for api/runpod.php)
#              DEPLOY_KNOWN_HOSTS (sftp only: output of `ssh-keyscan <host>`)
#   variables: DEPLOY_PROTOCOL (ftps or sftp, default ftps)
#              RUNPOD_TEMPLATE_ID, RUNPOD_GPU_IDS, RUNPOD_DATA_CENTER_IDS,
#              RUNPOD_NETWORK_VOLUME_ID, RUNPOD_CLOUD, RUNPOD_PORT,
#              RUNPOD_MAX_SESSION_MINUTES (see tools/runpod-config.py)

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Upload site files
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_TOKEN_SECRET: ${{ secrets.RUNPOD_TOKEN_SECRET }}
          RUNPOD_TEMPLATE_ID: ${{ vars.RUNPOD_TEMPLATE_ID }}
          RUNPOD_GPU_IDS: ${{ vars.RUNPOD_GPU_IDS }}
          RUNPOD_DATA_CENTER_IDS: ${{ vars.RUNPOD_DATA_CENTER_IDS }}
          RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
          RUNPOD_CLOUD: ${{ vars.RUNPOD_CLOUD }}
          RUNPOD_PORT: ${{ vars.RUNPOD_PORT }}
          RUNPOD_MAX_SESSION_MINUTES: ${{ vars.RUNPOD_MAX_SESSION_MINUTES }}
          DEPLOY_PROTOCOL: ${{ vars.DEPLOY_PROTOCOL || 'ftps' }}
        run: |
          set -euo pipefail

          # The static site and the RunPod backend proxy; the OSC server and start scripts are for local use
          files=(index.html script.js prompt-presets.js coloris.min.js coloris.min.css favicon.ico diffusion_lab_teaser.mp4 models/selfie_segmenter.tflite api/runpod.php api/.secrets/.htaccess)
          site_url="https://diffusionlab.de"
          secrets_dir="api/.secrets" # inside the web folder, blocked by its .htaccess

          for var in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "::error::Secret $var is not set in the production environment"
              exit 1
            fi
          done

          # Credentials go through a private netrc file, never the command line
          umask 077
          netrc="$RUNNER_TEMP/deploy.netrc"
          printf 'machine %s login %s password %s\n' "$DEPLOY_HOST" "$DEPLOY_USER" "$DEPLOY_PASSWORD" > "$netrc"
          trap 'rm -f "$netrc"' EXIT

          path="${DEPLOY_PATH%/}"
          case "$DEPLOY_PROTOCOL" in
            ftps)
              # FTP with mandatory TLS; paths are relative to the FTP login directory
              base="ftp://$DEPLOY_HOST${path:+/$path}"
              tls=(--ssl-reqd)
              ;;
            sftp)
              if [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
                echo "::error::sftp needs the DEPLOY_KNOWN_HOSTS secret to verify the server"
                exit 1
              fi
              mkdir -p ~/.ssh
              printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
              base="sftp://$DEPLOY_HOST/~${path:+/$path}"
              tls=()
              ;;
            *)
              echo "::error::DEPLOY_PROTOCOL must be ftps or sftp, got '$DEPLOY_PROTOCOL'"
              exit 1
              ;;
          esac

          for file in "${files[@]}"; do
            echo "Uploading $file"
            curl --fail --silent --show-error --retry 2 \
              --netrc-file "$netrc" "${tls[@]}" --ftp-create-dirs \
              --upload-file "$file" "$base/$file"
          done
          echo "Deployed ${#files[@]} files to $DEPLOY_PROTOCOL://$DEPLOY_HOST/${path}"

          # No longer part of the site (the Daydream backend): remove from the server, best effort
          obsolete=(api/daydream.php daydream_logo.svg api/.secrets/daydream.key api/.secrets/stream-creations.json)
          for file in "${obsolete[@]}"; do
            if [ "$DEPLOY_PROTOCOL" = ftps ]; then
              delete=(--quote "DELE ${path:+$path/}$file")
            else
              delete=(--quote "rm ${path:+$path/}$file")
            fi
            if curl --silent --netrc-file "$netrc" "${tls[@]}" "${delete[@]}" \
                --list-only "$base/$(dirname "$file")/" >/dev/null 2>&1; then
              echo "Removed obsolete $file"
            fi
          done

          # Secret files for api/.secrets/, built in the runner's temp folder
          secrets=()
          if python3 tools/runpod-config.py "$RUNNER_TEMP/runpod.json"; then
            secrets+=(runpod.json)
          else
            [ $? -eq 2 ] || exit 1
            echo "No RUNPOD_API_KEY secret: api/runpod.php keeps its current settings, if any"
          fi
          trap 'rm -f "$netrc" "$RUNNER_TEMP/runpod.json"' EXIT
          if [ ${#secrets[@]} -eq 0 ]; then
            exit 0
          fi

          # Prove the folder is blocked for web access before putting secrets there
          probe="probe-$(date +%s)-$RANDOM.txt"
          echo "harmless deploy probe" > "$RUNNER_TEMP/$probe"
          curl --fail --silent --show-error --netrc-file "$netrc" "${tls[@]}" \
            --upload-file "$RUNNER_TEMP/$probe" "$base/$secrets_dir/$probe"
          probe_status="$(curl -s -o /dev/null -w '%{http_code}' "$site_url/$secrets_dir/$probe")"
          # Best-effort cleanup; a leftover probe file is harmless
          if [ "$DEPLOY_PROTOCOL" = ftps ]; then
            remove=(--quote "DELE ${path:+$path/}$secrets_dir/$probe")
          else
            remove=(--quote "rm ${path:+$path/}$secrets_dir/$probe")
          fi
          curl --silent --netrc-file "$netrc" "${tls[@]}" "${remove[@]}" \
            --list-only "$base/$secrets_dir/" >/dev/null 2>&1 || true
          if [ "$probe_status" != "403" ] && [ "$probe_status" != "404" ]; then
            echo "::error::NOT uploading secrets: $secrets_dir/ is reachable from the web (HTTP $probe_status)"
            exit 1
          fi

          for secret in "${secrets[@]}"; do
            echo "Uploading $secrets_dir/$secret ($secrets_dir/ is blocked for web access: HTTP $probe_status)"
            curl --fail --silent --show-error --retry 2 --netrc-file "$netrc" "${tls[@]}" \
              --upload-file "$RUNNER_TEMP/$secret" "$base/$secrets_dir/$secret"
          done
