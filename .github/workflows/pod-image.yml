name: Build GPU pod image

# Builds pod/ (StreamDiffusion + WebRTC server) and pushes it to GitHub's container registry:
#   ghcr.io/<owner>/diffusionlab-pod:sha-<commit>   (pin this one in the RunPod template)
#   ghcr.io/<owner>/diffusionlab-pod:<branch>
# Runs on x86 runners, since RunPod GPU hosts are x86. Models and TensorRT engines are not in
# the image; they live on the RunPod network volume.

on:
  push:
    paths:
      - 'pod/Dockerfile'
      - 'pod/server.py'
      - 'pod/config.yaml'
      - 'pod/start.sh'
      - 'pod/install-env.sh'
      - '.github/workflows/pod-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: pod-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free disk space (the CUDA + torch + TensorRT image is large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image name and tags
        id: tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/diffusionlab-pod"
          branch="$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'a-zA-Z0-9._-' '-')"
          {
            echo "image=$image"
            echo "tags=$image:sha-${GITHUB_SHA::7},$image:$branch"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: pod
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false

      - name: Summary
        run: echo "Pushed ${{ steps.tags.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
